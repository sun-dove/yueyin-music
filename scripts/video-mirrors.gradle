if (System.getenv('VIDEO_MUSIC_BUILD') == '1') {
    gradle.beforeProject { project ->
        project.buildscript.repositories {
            maven { url = uri('https://maven.aliyun.com/repository/google') }
            mavenCentral()
            gradlePluginPortal()
        }
    }
    gradle.beforeSettings { settings ->
        settings.pluginManagement.repositories {
            maven { url = uri('https://maven.aliyun.com/repository/google') }
            mavenCentral()
            gradlePluginPortal()
        }
        settings.dependencyResolutionManagement {
            repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS)
            repositories {
                maven { url = uri('https://maven.aliyun.com/repository/google') }
                maven {
                    url = uri((System.getenv('FLUTTER_STORAGE_BASE_URL') ?: 'https://storage.googleapis.com') + '/download.flutter.io')
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
    }
}
